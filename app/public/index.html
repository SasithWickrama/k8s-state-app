<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persistent switch</title>
<style>
  :root { --bg:#eef2f1; --ink:#14201d; --on:#1f8a5b; --off:#8b9a95; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10181a; --ink:#e6efec; --on:#3ccf8e; --off:#5d6b67; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--ink); font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  main { text-align:center; padding:24px; }
  h1 { font-size:1.1rem; font-weight:600; margin:0 0 28px; }
  #toggle { width:220px; height:110px; border-radius:55px; border:0; cursor:pointer; position:relative;
            background:var(--off); transition:background .25s; }
  #toggle::after { content:""; position:absolute; top:10px; left:10px; width:90px; height:90px;
                   border-radius:50%; background:#fff; transition:transform .25s; }
  #toggle[aria-checked="true"] { background:var(--on); }
  #toggle[aria-checked="true"]::after { transform:translateX(110px); }
  #toggle:focus-visible { outline:3px solid var(--ink); outline-offset:4px; }
  #label { font-size:2.2rem; font-weight:700; margin:24px 0 6px; }
  #meta { font-size:.9rem; opacity:.7; min-height:1.4em; }
  @media (prefers-reduced-motion: reduce) { #toggle, #toggle::after { transition:none; } }
</style>
</head>
<body>
<main>
  <h1>Switch state saved in PostgreSQL</h1>
  <button id="toggle" role="switch" aria-checked="false" aria-label="Switch"></button>
  <div id="label">…</div>
  <div id="meta"></div>
</main>
<script>
  const btn = document.getElementById('toggle');
  const label = document.getElementById('label');
  const meta = document.getElementById('meta');

  function render(s) {
    btn.setAttribute('aria-checked', String(s.enabled));
    label.textContent = s.enabled ? 'On' : 'Off';
    meta.textContent = `Served by pod ${s.pod}`;
  }
  async function call(method, url) {
    try {
      const r = await fetch(url, { method });
      if (!r.ok) throw new Error((await r.json()).error || r.statusText);
      render(await r.json());
    } catch (e) {
      label.textContent = 'Database unreachable';
      meta.textContent = 'Try again in a few seconds.';
    }
  }
  btn.addEventListener('click', () => call('POST', '/api/toggle'));
  call('GET', '/api/state');
</script>
</body>
</html>
