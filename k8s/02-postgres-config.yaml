apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: state-app
data:
  # Pod 0 = primary. Other pods clone it with pg_basebackup and stream from it.
  entrypoint.sh: |
    #!/bin/bash
    set -e
    ORDINAL="${HOSTNAME##*-}"
    if [ "$ORDINAL" != "0" ] && [ ! -s "$PGDATA/PG_VERSION" ]; then
      PRIMARY=postgres-0.postgres-headless
      echo "Waiting for primary $PRIMARY..."
      until pg_isready -h "$PRIMARY" -p 5432 -q; do sleep 2; done
      echo "Cloning primary..."
      pg_basebackup -d "host=$PRIMARY port=5432 user=replicator password=$REPLICATION_PASSWORD" \
        -D "$PGDATA" -R -X stream -P
      chmod 700 "$PGDATA"
    fi
    exec docker-entrypoint.sh postgres
  # Runs only once, on the primary's first start (empty data dir).
  00-primary-init.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD '$REPLICATION_PASSWORD';
    EOSQL
    echo "host replication replicator all scram-sha-256" >> "$PGDATA/pg_hba.conf"
