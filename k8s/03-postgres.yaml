# Headless service: stable DNS names postgres-0.postgres-headless, postgres-1.postgres-headless
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: state-app
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
# Writes go here: always the primary (pod 0)
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: state-app
spec:
  selector:
    app: postgres
    statefulset.kubernetes.io/pod-name: postgres-0
  ports:
    - port: 5432
---
# Read-only load balancing across both pods
apiVersion: v1
kind: Service
metadata:
  name: postgres-read
  namespace: state-app
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: state-app
spec:
  serviceName: postgres-headless
  replicas: 2
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          command: ["/bin/bash", "/scripts/entrypoint.sh"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: appdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD }
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: REPLICATION_PASSWORD }
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: scripts
              mountPath: /scripts
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: scripts
          configMap:
            name: postgres-config
            defaultMode: 0555
            items:
              - { key: entrypoint.sh, path: entrypoint.sh }
        - name: initdb
          configMap:
            name: postgres-config
            defaultMode: 0555
            items:
              - { key: 00-primary-init.sh, path: 00-primary-init.sh }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
