<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persistent switch</title>
<style>
  :root {
    --bg:#eef2f1; --ink:#14201d; --panel:#f8faf9; --line:#c9d4d0;
    --on:#1f8a5b; --off:#8b9a95;
    --working:#1f8a5b; --restarting:#b9770e; --down:#c2362f; --unreachable:#6b5bc4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#10181a; --ink:#e6efec; --panel:#162224; --line:#2b3b3d;
      --on:#3ccf8e; --off:#5d6b67;
      --working:#3ccf8e; --restarting:#f2b84b; --down:#ff7b72; --unreachable:#a99bff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--ink); font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  main { text-align:center; padding:24px; width:100%; max-width:640px; }
  h1 { font-size:1.1rem; font-weight:600; margin:0 0 28px; }

  #toggle { width:220px; height:110px; border-radius:55px; border:0; cursor:pointer; position:relative;
            background:var(--off); transition:background .25s; }
  #toggle::after { content:""; position:absolute; top:10px; left:10px; width:90px; height:90px;
                   border-radius:50%; background:#fff; transition:transform .25s; }
  #toggle[aria-checked="true"] { background:var(--on); }
  #toggle[aria-checked="true"]::after { transform:translateX(110px); }
  #toggle:disabled { cursor:not-allowed; opacity:.5; }
  #toggle:focus-visible { outline:3px solid var(--ink); outline-offset:4px; }
  #label { font-size:2.2rem; font-weight:700; margin:24px 0 6px; }
  #meta { font-size:.9rem; opacity:.75; min-height:1.4em; }

  /* ---- database status ---- */
  #banner { margin:34px 0 14px; padding:12px 16px; border-left:6px solid var(--c, var(--off));
            background:var(--panel); text-align:left; font-weight:600; --c:var(--off); }
  #banner[data-status="working"]     { --c:var(--working); }
  #banner[data-status="restarting"]  { --c:var(--restarting); }
  #banner[data-status="down"]        { --c:var(--down); }
  #banner[data-status="unreachable"] { --c:var(--unreachable); }

  #nodes { display:grid; gap:10px; }
  .node { display:grid; grid-template-columns:1fr auto; gap:4px 16px; padding:14px 16px;
          border:1px solid var(--line); border-left:6px solid var(--c); background:var(--panel);
          text-align:left; --c:var(--off); }
  .node[data-status="working"]     { --c:var(--working); }
  .node[data-status="restarting"]  { --c:var(--restarting); }
  .node[data-status="down"]        { --c:var(--down); }
  .node[data-status="unreachable"] { --c:var(--unreachable); }
  .name { font-weight:700; }
  .role { font-size:.85rem; opacity:.7; margin-left:8px; font-weight:400; }
  .state { font-weight:700; color:var(--c); display:flex; align-items:center; gap:8px; justify-self:end; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--c); }
  .node[data-status="restarting"] .dot { animation:pulse 1s ease-in-out infinite; }
  .detail { grid-column:1 / -1; font-size:.9rem; opacity:.85; overflow-wrap:anywhere; }
  .facts { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px 18px; margin:6px 0 0; padding:0;
           list-style:none; font-size:.85rem; opacity:.75; }
  #foot { margin-top:12px; font-size:.8rem; opacity:.6; min-height:1.2em; }

  @keyframes pulse { 50% { opacity:.25; } }
  @media (prefers-reduced-motion: reduce) {
    #toggle, #toggle::after { transition:none; }
    .node[data-status="restarting"] .dot { animation:none; }
  }
</style>
</head>
<body>
<main>
  <h1>Switch state saved in PostgreSQL</h1>
  <button id="toggle" role="switch" aria-checked="false" aria-label="Switch" disabled></button>
  <div id="label">…</div>
  <div id="meta"></div>

  <div id="banner" role="status" data-status="">Checking databases…</div>
  <section id="nodes" aria-label="Database pods"></section>
  <div id="foot"></div>
</main>
<script>
  const btn = document.getElementById('toggle');
  const label = document.getElementById('label');
  const meta = document.getElementById('meta');
  const banner = document.getElementById('banner');
  const nodesEl = document.getElementById('nodes');
  const foot = document.getElementById('foot');

  const STATUS_TEXT = {
    working: 'Working',
    restarting: 'Restarting',
    down: 'Down',
    unreachable: 'Not reachable',
  };
  let lastStatus = null;
  const cards = {};

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ---------------------------------------------------------- the switch
  function renderState(s) {
    btn.setAttribute('aria-checked', String(s.enabled));
    label.textContent = s.enabled ? 'On' : 'Off';
    if (s.readOnly) {
      btn.disabled = true;
      meta.textContent = 'Read-only: the primary is unavailable, so this value comes from the replica';
    } else {
      btn.disabled = false;
      meta.textContent = `Served by pod ${s.pod}`;
    }
  }

  function renderUnavailable(message) {
    btn.disabled = true;
    label.textContent = 'Unavailable';
    const p = lastStatus && lastStatus.nodes.find((n) => n.expectedRole === 'primary');
    if (message) meta.textContent = message;
    else if (p) meta.textContent = `Writes are blocked: the primary is ${STATUS_TEXT[p.status].toLowerCase()}`;
    else meta.textContent = 'Cannot read the switch. Retrying…';
  }

  async function refreshState() {
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.statusText);
      renderState(j);
    } catch (e) {
      renderUnavailable();
    }
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const r = await fetch('/api/toggle', { method: 'POST' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.statusText);
      renderState(j);
    } catch (e) {
      renderUnavailable(`Could not save the change: ${e.message}`);
    }
  });

  // ------------------------------------------------------ database status
  function buildCard(name) {
    const root = el('article', 'node');
    const title = el('div', 'name', name);
    const role = el('span', 'role');
    title.appendChild(role);
    const state = el('div', 'state');
    const dot = el('span', 'dot');
    const stext = el('span');
    state.append(dot, stext);
    const detail = el('div', 'detail');
    const facts = el('ul', 'facts');
    root.append(title, state, detail, facts);
    cards[name] = { root, role, stext, detail, facts };
    nodesEl.appendChild(root);
  }

  function renderNode(n) {
    if (!cards[n.name]) buildCard(n.name);
    const c = cards[n.name];
    c.root.dataset.status = n.status;
    c.role.textContent = n.expectedRole;
    c.stext.textContent = STATUS_TEXT[n.status];
    c.detail.textContent = n.detail;

    const facts = [];
    if (n.role) facts.push(`Acting as: ${n.role}`);
    if (n.restarts !== null) facts.push(`Restarts: ${n.restarts}`);
    if (n.streaming !== null) facts.push(`Replicas streaming: ${n.streaming}`);
    if (n.enabled !== null) facts.push(`Stored value: ${n.enabled ? 'On' : 'Off'}`);
    if (n.latencyMs !== null) facts.push(`Response: ${n.latencyMs} ms`);
    c.facts.replaceChildren(...facts.map((f) => el('li', null, f)));
  }

  function renderBanner(nodes) {
    const primary = nodes.find((n) => n.expectedRole === 'primary');
    const replicas = nodes.filter((n) => n.expectedRole === 'replica');
    let status, text;
    if (primary && primary.status !== 'working') {
      status = primary.status;
      const reads = replicas.some((r) => r.status === 'working');
      text = `Primary ${STATUS_TEXT[primary.status].toLowerCase()}: writes are unavailable` +
             (reads ? ', reads are served by the replica' : '');
    } else {
      const bad = replicas.find((r) => r.status !== 'working');
      if (bad) {
        status = 'restarting';
        text = `Replica ${STATUS_TEXT[bad.status].toLowerCase()}: reads and writes still work, but there is no standby copy`;
      } else {
        status = 'working';
        text = 'All databases are working';
      }
    }
    banner.dataset.status = status;
    banner.textContent = text;
  }

  function renderStatus(s) {
    renderBanner(s.nodes);
    s.nodes.forEach(renderNode);
    const t = new Date(s.checkedAt).toLocaleTimeString();
    foot.textContent = s.k8s
      ? `Checked ${t} by ${s.servedBy}`
      : `Checked ${t} by ${s.servedBy}. Pod details are unavailable: apply the RBAC manifest to see restarts and pod state.`;
  }

  function renderStatusError() {
    banner.dataset.status = 'unreachable';
    banner.textContent = 'Cannot reach the application server, so database status is unknown';
    foot.textContent = '';
  }

  async function refreshStatus() {
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.statusText);
      lastStatus = await r.json();
      renderStatus(lastStatus);
    } catch (e) {
      lastStatus = null;
      renderStatusError();
    }
  }

  async function tick() {
    await Promise.all([refreshState(), refreshStatus()]);
    setTimeout(tick, 2000);
  }
  tick();
</script>
</body>
</html>
